version: '3.8'

services:
  # -------------------------------------------------------------------
  # 1. MinIO Storage (S3-compatible Object Storage cho Lakehouse)
  # -------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: minio_lakehouse
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web Console UI
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    command: server /data --console-address ":9001"

  # -------------------------------------------------------------------
  # 2. ClickHouse Server (Serving OLAP Data Warehouse Siêu Tốc)
  # -------------------------------------------------------------------
  clickhouse:
    image: clickhouse/clickhouse-server:24.1-alpine
    container_name: clickhouse_dwh
    ports:
      - "8123:8123"   # HTTP Client
      - "9000:9000"   # Native Client
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
