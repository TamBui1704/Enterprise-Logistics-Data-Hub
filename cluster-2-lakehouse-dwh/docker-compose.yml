version: '3.8'

services:
  # -------------------------------------------------------------------
  # 1. MinIO Storage (S3-compatible Object Storage cho Lakehouse)
  # -------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: minio_lakehouse
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web Console UI
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - logistics_net

  # -------------------------------------------------------------------
  # 2. ClickHouse Server (Serving OLAP Data Warehouse Siêu Tốc)
  # -------------------------------------------------------------------
  clickhouse:
    image: clickhouse/clickhouse-server:24.1-alpine
    container_name: clickhouse_dwh
    ports:
      - "8123:8123"   # HTTP Client (Web / REST / dbt)
      - "9009:9000"   # Native Protocol (Tránh trùng cổng 9000 với MinIO)
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    deploy:
      resources:
        limits:
          memory: 1536M
    networks:
      - logistics_net

  # -------------------------------------------------------------------
  # 3. Apache Spark / PySpark Runner (Xử lý Batch Initial Load & Streaming Delta)
  # -------------------------------------------------------------------
  pyspark:
    build: .
    image: custom-spark-runner:3.5.0
    container_name: spark_runner
    environment:
      - SPARK_MODE=master
    ports:
      - "8081:8080"   # Spark Master Web UI
      - "7077:7077"   # Spark Master Port
    volumes:
      - ./spark_jobs:/opt/bitnami/spark/spark_jobs
    deploy:
      resources:
        limits:
          memory: 1536M
    networks:
      - logistics_net

networks:
  logistics_net:
    name: logistics_net

volumes:
  minio_data:
  clickhouse_data:




