version: '3.8'

services:
  # -------------------------------------------------------------------
  # 1. Database Nguồn: Oracle Database XE (Tích hợp sẵn LogMiner & CDC)
  # -------------------------------------------------------------------
  # Sử dụng `quay.io/debezium/example-oracle:2.5.0.Final`:
  # - Đã bật sẵn ARCHIVELOG mode & Supplemental Logging cho Debezium LogMiner
  # - Khởi tạo sẵn CDB (ORCLCDB), PDB (ORCLPDB1), user `c##dbzuser` (password: dbz)
  # - Tối ưu tài nguyên nhẹ (~1.5GB - 2GB RAM), phù hợp cho máy RAM 12GB
  oracle-db:
    image: quay.io/debezium/example-oracle:2.5.0.Final
    container_name: source_oracle_db
    ports:
      - "1521:1521"
      - "5500:5500"
    environment:
      - ORACLE_PWD=top_secret
    volumes:
      - ./scripts/01_init_schema.sql:/docker-entrypoint-initdb.d/01_init_schema.sql
      - oracle_data:/u01/app/oracle/oradata
    deploy:
      resources:
        limits:
          memory: 2048M
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 1521"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - logistics_net

  # -------------------------------------------------------------------
  # 2. Apache Kafka (KRaft Mode - Không dùng Zookeeper để tiết kiệm RAM)
  # -------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka_broker
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      KAFKA_CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"
    deploy:
      resources:
        limits:
          memory: 768M
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - logistics_net

  # -------------------------------------------------------------------
  # 3. Debezium CDC Connector
  # -------------------------------------------------------------------
  debezium:
    image: debezium/connect:2.5.0.Final
    container_name: debezium_cdc
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: my_connect_configs
      OFFSET_STORAGE_TOPIC: my_connect_offsets
      STATUS_STORAGE_TOPIC: my_connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      HEAP_OPTS: "-Xmx512m -Xms512m"
    deploy:
      resources:
        limits:
          memory: 768M
    depends_on:
      kafka:
        condition: service_healthy
      oracle-db:
        condition: service_healthy
    networks:
      - logistics_net

  # -------------------------------------------------------------------
  # 4. Kafka UI (Giao diện Web xem Topics & CDC Messages)
  # -------------------------------------------------------------------
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka_ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local-logistics-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    deploy:
      resources:
        limits:
          memory: 256M
    depends_on:
      - kafka
    networks:
      - logistics_net

networks:
  logistics_net:
    name: logistics_net

volumes:
  oracle_data:
  kafka_data:




