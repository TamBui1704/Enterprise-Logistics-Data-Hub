version: '3.8'

services:
  # -------------------------------------------------------------------
  # 1. Cube.dev (Semantic Metrics Layer - Quản lý chỉ số Logistics tập trung)
  # -------------------------------------------------------------------
  cube:
    image: cubejs/cube:v0.35.0
    container_name: cube_semantic_layer
    ports:
      - "4000:4000"     # REST/GraphQL API & Developer Playground
      - "15432:5432"    # Cổng SQL API (Mạo danh Postgres) dành cho Superset
    environment:
      - CUBEJS_DB_TYPE=clickhouse
      - CUBEJS_DB_HOST=clickhouse_dwh
      - CUBEJS_DB_PORT=8123
      - CUBEJS_DB_NAME=default
      - CUBEJS_DB_USER=default
      - CUBEJS_DB_PASS=
      - CUBEJS_DEV_MODE=true
      - CUBEJS_API_SECRET=logistics-super-secret
      - CUBEJS_PG_SQL_PORT=5432
      - KEYCLOAK_URL=http://keycloak:8080
      - KEYCLOAK_REALM=master
    volumes:
      - ./cube_conf:/cube/conf
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - logistics_net

  # -------------------------------------------------------------------
  # 2. Apache Superset (Visual BI Dashboard & Self-service Analytics)
  # -------------------------------------------------------------------
  superset:
    image: apache/superset:3.0.2
    container_name: superset_bi
    ports:
      - "8088:8088"
    environment:
      SUPERSET_SECRET_KEY: "logistics_superset_secret_key"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - logistics_net

networks:
  logistics_net:
    name: logistics_net
