services:
  # -------------------------------------------------------------------
  # 1. Cube.dev (Semantic Metrics Layer - Quản lý chỉ số Logistics tập trung)
  # -------------------------------------------------------------------
  cube:
    image: cubejs/cube:v0.35.0
    container_name: cube_semantic_layer
    ports:
      - "4000:4000"     # REST/GraphQL API & Developer Playground
      - "15432:5432"    # Cổng SQL API (Mạo danh Postgres) dành cho Superset
    environment:
      - CUBEJS_DB_TYPE=clickhouse
      - CUBEJS_DB_HOST=clickhouse_dwh
      - CUBEJS_DB_PORT=8123
      - CUBEJS_DB_NAME=default
      - CUBEJS_DB_USER=default
      - CUBEJS_DB_PASS=
      - CUBEJS_DEV_MODE=true
      - CUBEJS_API_SECRET=logistics-super-secret
      - CUBEJS_PG_SQL_PORT=5432
      - CUBEJS_SQL_USER_PASSWORD=logistics-super-secret-sql-pass
      - KEYCLOAK_URL=http://keycloak:8080
      - KEYCLOAK_REALM=logistics
      - NODE_OPTIONS=--max-old-space-size=1024
    volumes:
      - ./cube_conf:/cube/conf
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          memory: 1536M
    networks:
      - logistics_net

  # -------------------------------------------------------------------
  # 2. Apache Superset (Visual BI Dashboard & Self-service Analytics)
  # -------------------------------------------------------------------
  superset:
    build:
      context: .
      dockerfile: Dockerfile
    image: superset-enterprise:3.0.2
    container_name: superset_bi
    ports:
      - "8088:8088"
    environment:
      SUPERSET_SECRET_KEY: "eoHUQRNM9qxa4XnYvz53rHqf7x3ZRccQ"
      ENABLE_KEYCLOAK: "true"
      KEYCLOAK_INTERNAL_URL: "http://sso.192.168.63.106.nip.io:8080"
      KEYCLOAK_EXTERNAL_URL: "http://sso.192.168.63.106.nip.io:8080"
      KEYCLOAK_REALM: "logistics"
      KEYCLOAK_CLIENT_ID: "superset"
      KEYCLOAK_CLIENT_SECRET: "eoHUQRNM9qxa4XnYvz53rHqf7x3ZRccQ"
    volumes:
      - superset_home:/app/superset_home
      - ./superset_patch/helpers.py:/app/superset/models/helpers.py
      - ./create_logistics_dashboard.py:/app/create_logistics_dashboard.py
      - ./superset_config.py:/app/pythonpath/superset_config.py
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          memory: 1536M
    networks:
      - logistics_net

networks:
  logistics_net:
    external: true

volumes:
  superset_home:
