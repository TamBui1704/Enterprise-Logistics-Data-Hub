cubes:
  - name: DriverShifts
    sql: SELECT * FROM default.obt_driver_shifts

    # LUẬT RLS (ROW LEVEL SECURITY) TẠI TẦNG CUBE
    query_rewrite:
      - name: enforce_rls
        sql: |
          {% if COMPILE_CONTEXT.securityContext.province_access contains 'ALL' or COMPILE_CONTEXT.securityContext.role == 'ADMIN' %}
            ${COMPILE_CONTEXT.sql}
          {% else %}
            SELECT * FROM (${COMPILE_CONTEXT.sql}) AS rls_tbl 
            WHERE rls_tbl.SENDING_PROVINCE IN (
              {% for p in COMPILE_CONTEXT.securityContext.province_access %}
                '{{ p }}'{% if not loop.last %},{% endif %}
              {% endfor %}
            )
          {% endif %}

    measures:
      - name: totalShifts
        type: count
        title: Tổng Ca Chạy

      - name: totalDistanceKm
        sql: DISTANCE_KM
        type: sum
        title: Tổng Quãng Đường (Km)

    dimensions:
      - name: shiftId
        sql: SHIFT_ID
        type: string
        primary_key: true
        title: Mã Ca Chạy

      - name: shiftDate
        sql: SHIFT_DATE
        type: time
        title: Ngày Chạy

      - name: driverName
        sql: DRIVER_NAME
        type: string
        title: Tên Tài Xế

      - name: sendingProvince
        sql: SENDING_PROVINCE
        type: string
        title: Tỉnh Xuất Phát

    pre_aggregations:
      - name: distanceByDriverAndDate
        measures:
          - totalDistanceKm
          - totalShifts
        dimensions:
          - driverName
          - sendingProvince
        time_dimension: shiftDate
        granularity: day
        partition_granularity: month
        refresh_key:
          every: 1 hour
