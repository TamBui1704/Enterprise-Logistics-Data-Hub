cubes:
  - name: DriverShifts
    sql: SELECT * FROM default.obt_driver_shifts

    measures:
      - name: totalShifts
        type: count
        title: Tổng Ca Chạy

      - name: totalDistanceKm
        sql: DISTANCE_KM
        type: sum
        title: Tổng Quãng Đường (Km)

    dimensions:
      - name: shiftId
        sql: SHIFT_ID
        type: string
        primary_key: true
        title: Mã Ca Chạy

      - name: shiftDate
        sql: SHIFT_DATE
        type: time
        title: Ngày Chạy

      - name: driverName
        sql: DRIVER_NAME
        type: string
        title: Tên Tài Xế

      - name: sendingProvince
        sql: SENDING_PROVINCE
        type: string
        title: Tỉnh Xuất Phát
