cubes:
  - name: Shipments
    sql: SELECT * FROM default.obt_shipment_analytics

    # LUẬT RLS (ROW LEVEL SECURITY) TẠI TẦNG CUBE
    # Tự động chèn câu lệnh WHERE lọc theo tỉnh thành dựa trên securityContext lấy từ ClickHouse + Keycloak
    query_rewrite:
      - name: enforce_rls
        sql: |
          {% if COMPILE_CONTEXT.securityContext.province_access contains 'ALL' or COMPILE_CONTEXT.securityContext.role == 'ADMIN' %}
            ${COMPILE_CONTEXT.sql}
          {% else %}
            SELECT * FROM (${COMPILE_CONTEXT.sql}) AS rls_tbl 
            WHERE rls_tbl.SENDING_PROVINCE IN (
              {% for p in COMPILE_CONTEXT.securityContext.province_access %}
                '{{ p }}'{% if not loop.last %},{% endif %}
              {% endfor %}
            )
          {% endif %}

    # 1. MEASURES (Các chỉ số đo lường)
    measures:
      - name: totalBookings
        type: count
        title: Tổng Số Đơn Hàng

      - name: totalRevenue
        sql: TOTAL_REVENUE
        type: sum
        title: Tổng Doanh Thu (VND)
        format: currency

      - name: totalProfit
        sql: PROFIT_AMOUNT
        type: sum
        title: Tổng Lợi Nhuận (VND)
        format: currency

    # 2. DIMENSIONS (Các chiều phân tích)
    dimensions:
      - name: bookingId
        sql: BOOKING_ID
        type: string
        primary_key: true
        title: Mã Đơn Hàng

      - name: bookingDate
        sql: BOOKING_DATE
        type: time
        title: Ngày Gửi Hàng

      - name: sendingProvince
        sql: SENDING_PROVINCE
        type: string
        title: Tỉnh Gửi

      - name: receivingProvince
        sql: RECEIVING_PROVINCE
        type: string
        title: Tỉnh Nhận

      - name: statusName
        sql: STATUS_NAME
        type: string
        title: Trạng Thái Đơn

