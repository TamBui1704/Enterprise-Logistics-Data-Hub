cubes:
  - name: Shipments
    sql: SELECT * FROM default.obt_shipment_analytics

    # 1. MEASURES (Các chỉ số đo lường)
    measures:
      - name: totalBookings
        type: count
        title: Tổng Số Đơn Hàng

      - name: totalRevenue
        sql: TOTAL_REVENUE
        type: sum
        title: Tổng Doanh Thu (VND)
        format: currency

      - name: totalProfit
        sql: PROFIT_AMOUNT
        type: sum
        title: Tổng Lợi Nhuận (VND)
        format: currency

    # 2. DIMENSIONS (Các chiều phân tích)
    dimensions:
      - name: bookingId
        sql: BOOKING_ID
        type: string
        primary_key: true
        title: Mã Đơn Hàng

      - name: bookingDate
        sql: BOOKING_DATE
        type: time
        title: Ngày Gửi Hàng

      - name: sendingProvince
        sql: SENDING_PROVINCE
        type: string
        title: Tỉnh Gửi

      - name: receivingProvince
        sql: RECEIVING_PROVINCE
        type: string
        title: Tỉnh Nhận

      - name: statusName
        sql: STATUS_NAME
        type: string
        title: Trạng Thái Đơn
